<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sem Conexão - Almoxarifado Central CCB</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    body {
      background-color: #f4f6f9;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .offline-card {
      max-width: 480px;
      width: 90%;
      border-radius: 1rem;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      border: none;
    }
    .brand-header {
      background-color: #003b57;
      color: white;
      border-top-left-radius: 1rem;
      border-top-right-radius: 1rem;
      padding: 1.5rem;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="card offline-card">
    <div class="brand-header">
      <h4 class="mb-1 fw-bold">CONGREGAÇÃO CRISTÃ NO BRASIL</h4>
      <small class="text-light opacity-75">Gestão de Almoxarifado Central</small>
    </div>
    <div class="card-body p-4 text-center">
      <div class="mb-3 text-warning">
        <i class="bi bi-wifi-off display-1"></i>
      </div>
      <h4 class="fw-bold text-dark mb-2">Sem Conexão com a Internet</h4>
      <p class="text-secondary small mb-4">
        Você está navegando em modo offline ou sua conexão Wi-Fi foi interrompida.
        As consultas e movimentações de estoque necessitam de validação em tempo real no servidor para garantir a integridade do saldo.
      </p>
      <button onclick="window.location.reload();" class="btn btn-primary px-4 py-2 fw-semibold rounded-pill w-100">
        <i class="bi bi-arrow-clockwise me-1"></i> Tentar Novamente
      </button>
    </div>
  </div>
</body>
</html>
